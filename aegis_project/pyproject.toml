[project]
name = "aegis"
version = "0.1.0"
description = "Autonomous Evolutionary General Intelligent System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",          
    "pydantic>=2.7.0",        
    "jsonschema>=4.22.0",     
    "python-docx>=1.1.2",     
    "python-pptx>=0.6.23",    
    "openpyxl>=3.1.2",        
    "chromadb>=0.5.0",        
    "trafilatura>=1.8.0",     
    "beautifulsoup4>=4.12.3", 
    "lxml>=5.2.0",            
    "aiofiles>=23.2.1",       
    "jsonpatch>=1.33",        
    "psutil>=5.9.8",     
    "streamlit>=1.35.0",            
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.pytest.ini_options]
# Это указывает pytest автоматически искать код внутри папки src
pythonpath = ["src"]
# Это убирает надоедливые желтые предупреждения в терминале
asyncio_default_fixture_loop_scope = "function"
# Эта строчка прикажет pytest игнорировать и скрывать сторонние предупреждения jsonschema
filterwarnings = [
    "ignore::DeprecationWarning"
]